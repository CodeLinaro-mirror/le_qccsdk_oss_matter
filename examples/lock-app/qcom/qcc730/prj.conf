# ============================================================
# Matter (CHIP) stack
# ============================================================
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="main/include/CHIPProjectConfig.h"
# CHIP PID: 32773 == 0x8005 (lock-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_LIB_SHELL=n
CONFIG_CHIP_ENABLE_READ_CLIENT=n

# ============================================================
# C++ standard
# ============================================================
CONFIG_STD_CPP17=y

# ============================================================
# Logging
# ============================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_MATTER_LOG_LEVEL_ERR=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_LOG_PRINTK=n

# ============================================================
# Shell (Zephyr shell + WiFi shell; Matter shell disabled above)
# ============================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_WILDCARD=n
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y

# ============================================================
# Kernel
# ============================================================
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=2048
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_NUM_COOP_PRIORITIES=16
CONFIG_IDLE_STACK_SIZE=1024

# ============================================================
# Networking
# ============================================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=14
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_CONTEXT_RECV_PKTINFO=y

# Network buffers
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32

CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_WIFI=y

# ============================================================
# WiFi
# ============================================================
CONFIG_WIFI=y
CONFIG_WIFI_QCOM=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_WIFI_QCOM_AUTO_DHCPV4=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=y

# BLE disabled (commissioning over WiFi)
CONFIG_BT=n

# ============================================================
# Crypto (mbedTLS provided by Zephyr)
# ============================================================
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_CIPHER_CCM_ENABLED=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y

# Enable QCC730 hardware crypto (PKA engine).
CONFIG_QCRYPTO=y

# ============================================================
# Flash / Settings / NVS (needed by Matter KVS)
# ============================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=16

# ============================================================
# GPIO / Serial / Console
# ============================================================
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# ============================================================
# System
# ============================================================
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# ============================================================
# Debug / Assert
# ============================================================
CONFIG_DEBUG=y
CONFIG_ASSERT=n
# CONFIG_ASSERT_NO_FILE_INFO=y   # 临时开启，方便定位 crash 位置
CONFIG_ASSERT_NO_COND_INFO=y
CONFIG_ASSERT_NO_MSG_INFO=y

# ============================================================
# Size optimizations
# ============================================================
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_PICOLIBC=y

# ---------------------------------------------------------------------------
# Commissioning window auto-open
# ---------------------------------------------------------------------------
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# ---------------------------------------------------------------------------
# SPAKE2+ / ECC performance fixes
# ---------------------------------------------------------------------------
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="qcc730mi-mbedtls-perf.h"

# ---------------------------------------------------------------------------
# WiFi Station mode for NetworkCommissioning cluster
# ---------------------------------------------------------------------------
CONFIG_CHIP_ENABLE_WIFI_STATION=y

# ============================================================
# Host / Hostless mode selection
# ============================================================
# CONFIG_LOCK_HOST_MODE=y  — Host mode: STM32 via Ring Service (default)
# CONFIG_LOCK_HOST_MODE=n  — Hostless: all ops handled locally, log only
CONFIG_LOCK_HOST_MODE=n

# ============================================================
# Ring Service buffer configuration (only relevant in Host mode)
# ============================================================
# Lock app uses Ring 0 only; small buffers (lock msgs are ≤ 8 bytes).
CONFIG_RING0_DESC_COUNT=4
CONFIG_RING0_BUF_SIZE=64
CONFIG_RING1_DESC_COUNT=4
CONFIG_RING1_BUF_SIZE=64
CONFIG_RING2_DESC_COUNT=4
CONFIG_RING2_BUF_SIZE=64

# ---------------------------------------------------------------------------
# mbedTLS symbols required for Matter commissioning (CSRRequest stage)
# ---------------------------------------------------------------------------
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y

# ---------------------------------------------------------------------------
# RRAM size reduction
# ---------------------------------------------------------------------------
CONFIG_DEBUG_OPTIMIZATIONS=y

# Disable extended discovery (reduces mDNS advertising code, saves ~3KB)
CONFIG_CHIP_EXTENDED_DISCOVERY=n

# ============================================================
# Matter ICD (Intermittently Connected Device) — SIT mode
# ============================================================
# Door lock uses SIT ICD (Short Idle Time, slow polling ≤ 15s).
# In Idle Mode: BMPS on + S2RAM unlocked (WiFi FW handles beacons).
# In Active Mode: BMPS off + S2RAM locked (MCU fully awake).
# Note: ICD is only available in Host mode (CONFIG_LOCK_HOST_MODE=y).
# CONFIG_CHIP_ENABLE_ICD_SUPPORT=y
CONFIG_CHIP_ICD_LIT_SUPPORT=n
CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=10000
CONFIG_CHIP_ICD_FAST_POLLING_INTERVAL=200
CONFIG_CHIP_ICD_IDLE_MODE_DURATION=10
CONFIG_CHIP_ICD_ACTIVE_MODE_DURATION=1000
CONFIG_CHIP_ICD_ACTIVE_MODE_THRESHOLD=300

# Disable net shell (net stats/iface commands not needed for lock app).
# wifi shell (CONFIG_NET_L2_WIFI_SHELL) is kept for 'wifi connect' command.
CONFIG_NET_SHELL=n

# ============================================================
# Power Management (S2RAM deep sleep + BMPS)
# ============================================================
CONFIG_PM=y
CONFIG_PM_DEVICE=y
# AON timer manager: required for mlme_go_to_sleep → aon_timer_register
# Without this, aon_list_mutex is NULL and nt_wlan hangs permanently
CONFIG_COUNTER=y
CONFIG_COUNTER_QCC730_AON=y

# ============================================================
# Lock App specific
# ============================================================
CONFIG_MATTER_LOCK_APP=y
CONFIG_NET_L2_OPENTHREAD=n
