# ============================================================
# Matter (CHIP) stack
# ============================================================
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="main/include/CHIPProjectConfig.h"
# CHIP PID: 32769 == 0x8001 (all-clusters-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32769
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_LIB_SHELL=n
CONFIG_CHIP_ENABLE_READ_CLIENT=y

# ============================================================
# C++ standard
# ============================================================
CONFIG_STD_CPP17=y

# ============================================================
# Logging
# ============================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_MATTER_LOG_LEVEL_INF=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
# Disable LOG_PRINTK so WiFi FW printk() goes direct to UART, bypassing
# the shell log backend mutex. Without this, WiFi FW init calls printk()
# which routes through z_log_vprintk() -> shell backend -> z_shell_lock()
# -> deadlock if shell thread holds the mutex. (v1.0 fix 4.9)
CONFIG_LOG_PRINTK=n

# ============================================================
# Shell (Zephyr shell + WiFi shell; Matter shell disabled above)
# ============================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_WILDCARD=n
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y

# ============================================================
# Kernel
# ============================================================
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=2048
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_NUM_COOP_PRIORITIES=16

# ============================================================
# Networking
# ============================================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=14
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_CONTEXT_RECV_PKTINFO=y

# Network buffers
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32

# WiFi statistics.
# NET_STATISTICS_PER_INTERFACE=y embeds struct net_stats inside struct net_if,
# making sizeof(net_if) depend on which sub-options are enabled.  A stale
# qcom_wifi_drv.c.obj compiled with a different sub-option set (e.g. without
# CONFIG_NET_STATISTICS_IGMP) causes a struct size mismatch that triggers:
#   ASSERTION FAIL [iface_check <= _net_if_list_end] @ net_if.c:6344
# This is safe to re-enable as long as every build is pristine when prj.conf
# changes (guaranteed by the MD5 hash check in build.sh).
# NET_STATISTICS_USER_API + NET_STATISTICS_WIFI are required so that
# NET_REQUEST_STATS_GET_WIFI is defined for WiFiManager::GetNetworkStatistics().
# NET_STATISTICS_PER_INTERFACE is required so that "net stats" shell command
# actually prints per-interface counters (net_shell_print_statistics_all is
# gated on IS_ENABLED(CONFIG_NET_STATISTICS_PER_INTERFACE)).
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_WIFI=y

# ============================================================
# WiFi
# ============================================================
CONFIG_WIFI=y
CONFIG_WIFI_QCOM=y
# CONFIG_NET_DHCPV4 is required by CONFIG_WIFI_QCOM_AUTO_DHCPV4 (Kconfig
# "depends on NET_DHCPV4"). Without it the driver's net_dhcpv4_start() call
# is compiled out and the device never gets an IP address after WiFi connect.
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_WIFI_QCOM_AUTO_DHCPV4=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=y

# BLE disabled (commissioning over WiFi)
CONFIG_BT=n

# ============================================================
# Crypto (mbedTLS provided by Zephyr)
# ============================================================
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_CIPHER_CCM_ENABLED=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y

# Enable QCC730 hardware crypto (PKA engine).
# This links libcryptoqcc730.a and activates MBEDTLS_ECP_ALT / AES_ALT /
# SHA_ALT / CCM_ALT for Zephyr-compiled code, routing P-256 ECC, AES, and
# SHA-256 through the QCC730 PKA hardware accelerator.
# Expected speedup: ~40-65x for ECC operations (ECDSA sign/verify, ECDH).
# Commissioning: ~55s -> ~3-5s. CASE setup: ~19.5s -> ~0.5s.
CONFIG_QCRYPTO=y

# ============================================================
# Flash / Settings / NVS (needed by Matter KVS)
# ============================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# NVS optimization: increase sector count to reduce GC frequency during
# commissioning. Default 8 sectors x 4KB = 32KB fills quickly with large
# Matter certs (RCAC 293B, NOC+ICAC+IPK 566B), triggering sector erase
# (up to 400ms each) multiple times. 16 sectors x 4KB = 64KB gives enough
# headroom for a full commissioning cycle without triggering GC.
# Matches the enlarged storage_partition in boards/qcc730mi.overlay (64KB).
CONFIG_SETTINGS_NVS_SECTOR_COUNT=16

# ============================================================
# GPIO / Serial / Console
# ============================================================
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# ============================================================
# System
# ============================================================
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# ============================================================
# Debug / Assert
# ============================================================
CONFIG_DEBUG=y
CONFIG_ASSERT=y
# Strip file/condition/message strings from assert rodata to save ~3-5 KB
# Keep assert info to debug the startup assertion failure
# Strip file/condition/message strings from assert rodata to save ~3-5 KB.
# Needed because X509 cert parsing code (+12KB) pushes the binary past
# the regdb address (0x373000) in RRAM. We need to save at least 2KB.
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_ASSERT_NO_COND_INFO=y
CONFIG_ASSERT_NO_MSG_INFO=y

# ============================================================
# Size optimizations
# ============================================================
# Increase net_mgmt event thread stack to prevent stack overflow in
# WifiMgmtEventHandler -> ConnectHandler -> ScheduleLambda call chain.
# Default 768 bytes is too small; 2048 is sufficient.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# Increase net_mgmt event queue: during WiFi connect, nt_dpm_add_dev_to_stack
# fires CARRIER_OFF/ON + IF_DOWN/UP + IPv6 events (5+ entries) before
# NET_EVENT_WIFI_CONNECT_RESULT. Default queue=5 / timeout=10ms silently
# drops the CONNECT_RESULT. Match qcli_app values (queue=16, timeout=5000ms).
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Use picolibc (same as qcli_app). NEWLIB_LIBC_NANO must NOT be used with
# CONFIG_NET_SHELL=y: NET_SHELL->REQUIRES_FLOAT_PRINTF->NEWLIB_LIBC_FLOAT_PRINTF
# ->-u_printf_float->_printf_float called in every vsnprintf->crashes WiFi FW.
# picolibc has no such side-effect (matches qcli_app behaviour exactly).
CONFIG_PICOLIBC=y

# ---------------------------------------------------------------------------
# Commissioning window auto-open
# ---------------------------------------------------------------------------
# Open the commissioning window automatically on boot when no fabric is
# provisioned. Without this flag CHIP_DEVICE_CONFIG_ENABLE_PAIRING_AUTOSTART
# defaults to 0 on Zephyr, so Server::Init() skips
# OpenBasicCommissioningWindow() and the device never advertises
# _matterc._udp — chip-tool cannot discover it via mDNS.
# Window duration = CHIP_DEVICE_CONFIG_DISCOVERY_TIMEOUT_SECS = 15 min
# (CHIP_DEVICE_CONFIG_EXT_ADVERTISING is not set, so the 48 h path is not taken).
# After commissioning (FabricCount > 0) the window stays closed on reboot.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# ---------------------------------------------------------------------------
# SPAKE2+ / ECC performance fixes (PASE commissioning hang)
# ---------------------------------------------------------------------------
# Root cause: Zephyr's config-mbedtls.h sets worst-case ECC parameters
# (MPI_WINDOW=1, ECP_WINDOW=2, ECP_FIXED_POINT_OPTIM=0), causing SPAKE2+
# HandlePake1() to block the CHIP thread for ~14.3s on QCC730 (Cortex-M33).
# The WiFi FW beacon miss threshold (30 × 100ms = 3s) fires during this
# blocking, disconnecting WiFi and killing the PASE session.
#
# Fix 1: Override mbedTLS ECC params via user config file.
#   Reduces ECC time from ~14.3s to ~4-6s (~2.5x speedup).
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="qcc730mi-mbedtls-perf.h"
#

# ---------------------------------------------------------------------------
# WiFi Station mode for NetworkCommissioning cluster
# ---------------------------------------------------------------------------
# Without this, CHIP_DEVICE_CONFIG_ENABLE_WIFI_STATION = 0 on Zephyr, which
# causes NetworkCommissioningCluster::Attributes() to omit ConnectMaxTimeSeconds
# from the attribute list. chip-tool reads ConnectMaxTimeSeconds during
# ReadCommissioningInfo and gets CHIP_ERROR_KEY_NOT_FOUND → commissioning fails.
# Setting this enables the #if block in NetworkCommissioningCluster.cpp that
# adds ScanMaxTimeSeconds, ConnectMaxTimeSeconds, SupportedWiFiBands to the list.
CONFIG_CHIP_ENABLE_WIFI_STATION=y

# ---------------------------------------------------------------------------
# mbedTLS symbols required for Matter commissioning (CSRRequest stage)
# ---------------------------------------------------------------------------
# These are defaults in config/zephyr/chip-module/Kconfig.mbedtls but that
# file is not sourced by our chip-module/Kconfig, so they must be set here.
#
# CONFIG_MBEDTLS_X509_CSR_WRITE_C: enables X.509 CSR writing.
#   Without it, NewCertificateSigningRequest() fails with
#   "MBEDTLS_X509_CSR_WRITE_C is not enabled" → CSRRequest returns FAILURE.
#
# CONFIG_MBEDTLS_PK_WRITE_C: enables PK (public key) writing.
#   Required by X509_CSR_WRITE_C as a dependency (mbedTLS internal).
# CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED: enables X509_CRT_PARSE_C
#   in config-mbedtls.h (it is only defined when a KEY_EXCHANGE symbol is set).
#   X509_CRT_PARSE_C → X509_USE_C → PK_PARSE_C → PK_C, which are all
#   prerequisites for PK_WRITE_C and X509_CREATE_C (needed by X509_CSR_WRITE_C).
#   NOTE: adds ~12KB; ASSERT_NO_* flags save ~30KB to keep binary under regdb limit.
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y


# ---------------------------------------------------------------------------
# RRAM size reduction — Phase 2 Kconfig optimizations
# ---------------------------------------------------------------------------

# Net statistics: keep current settings (already set in Networking section above)
# Keep WIFI stats: required by WiFiManager.cpp (NET_REQUEST_STATS_GET_WIFI)
# and DiagnosticDataProviderImplWiFi.cpp (NET_REQUEST_STATS_RESET_WIFI)
# CONFIG_NET_STATISTICS=n  ← cannot disable: WiFiManager depends on it
# CONFIG_NET_STATISTICS_WIFI=n  ← cannot disable: WiFiManager depends on it
# Keep current settings (already set in prj.conf above)

# Keep debug optimizations (-Og) matching v1.0 verified build.
# SIZE_OPTIMIZATIONS (-Os) passes -Os to both Zephyr CMake AND GN (libCHIP.a),
# which causes timing-sensitive WiFi driver code to misbehave (same class of
# issue as the -u_printf_float crash). Revert to -Og for stability.
CONFIG_DEBUG_OPTIMIZATIONS=y

# Explicit BLE/Thread disable (belt-and-suspenders, already off via platform config)
CONFIG_NET_L2_OPENTHREAD=n
